<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8892b0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glass-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#glass-glow)">
    <!-- Main "D" Frame -->
    <path d="M100 80 V320 H180 C240 320 280 280 280 200 C280 120 240 80 180 80 H100Z" 
          stroke="url(#chrome-grad)" stroke-width="8" stroke-linejoin="round" fill="rgba(10, 25, 47, 0.5)"/>
    
    <!-- "D" Inner Cutout -->
    <path d="M130 110 V290 H170 C210 290 240 260 240 200 C240 140 210 110 170 110 H130Z" 
          stroke="#64ffda" stroke-width="2" stroke-opacity="0.5" fill="none"/>
          
    <!-- The "V" Arrow - Originating from center, cutting through right side -->
    <path d="M180 200 L320 70 M320 70 L280 75 M320 70 L315 110" 
          stroke="#64ffda" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Subtle reflection highlight -->
    <path d="M110 90 H170 C220 90 250 120 250 180" 
          stroke="white" stroke-width="2" stroke-opacity="0.3" fill="none"/>
  </g>
</svg>
